<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel de opiniones | Kobu Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .adm { max-width: 760px; margin: 0 auto; padding: 40px 20px 60px; }
  .adm h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 900; text-align: center; margin-bottom: 24px; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: grid; gap: 14px; max-width: 440px; margin: 0 auto; }
  .box h2 { font-size: 1.3rem; font-weight: 700; }
  .box p { color: var(--muted); }
  .link-btn { background: none; border: 0; color: var(--link); font: 600 .95rem var(--body); cursor: pointer; padding: 4px; }
  .msg { font-weight: 600; text-align: center; min-height: 1.3em; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .items { display: grid; gap: 16px; }
  .item { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid #CA8A04; border-radius: 16px; padding: 20px; display: grid; gap: 10px; }
  .item.ok { border-left-color: var(--ok); }
  .item .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
  .item .meta { color: var(--muted); font-size: .92rem; }
  .item .texto { white-space: pre-wrap; }
  .item textarea { min-height: 64px; }
  .acciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .acciones .btn { padding: 8px 16px; font-size: .95rem; }
  .btn-peligro { background: var(--err); color: #fff; border-color: var(--err); }
  .vacío { color: var(--muted); text-align: center; padding: 24px; }
  .oculto { display: none !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
</head>
<body>
<main class="adm">
  <h1>Panel de opiniones</h1>

  <form id="login" class="box">
    <h2>Iniciar sesión</h2>
    <input id="email" type="email" required placeholder="Correo de administrador" autocomplete="username" aria-label="Correo de administrador">
    <input id="password" type="password" required placeholder="Contraseña" autocomplete="current-password" aria-label="Contraseña">
    <button class="btn btn-main" type="submit">Entrar</button>
    <button id="forgot" class="link-btn" type="button">¿Olvidaste tu contraseña?</button>
    <p id="login-error" class="msg err" role="alert"></p>
  </form>

  <form id="reset" class="box oculto">
    <h2>Recuperar contraseña</h2>
    <p>Te enviaremos un enlace al correo de administrador. Ábrelo para volver aquí y crear la contraseña.</p>
    <input id="reset-email" type="email" required placeholder="Correo de administrador" autocomplete="email" aria-label="Correo de administrador">
    <button class="btn btn-main" type="submit">Enviar enlace</button>
    <button id="volver" class="link-btn" type="button">Volver a iniciar sesión</button>
    <p id="reset-msg" class="msg" role="status"></p>
  </form>

  <form id="nueva" class="box oculto">
    <h2>Crear nueva contraseña</h2>
    <input id="pw1" type="password" required minlength="6" placeholder="Nueva contraseña" autocomplete="new-password" aria-label="Nueva contraseña">
    <input id="pw2" type="password" required minlength="6" placeholder="Confirma la contraseña" autocomplete="new-password" aria-label="Confirma la contraseña">
    <button class="btn btn-main" type="submit">Guardar contraseña</button>
    <p id="nueva-msg" class="msg" role="status"></p>
  </form>

  <section id="panel" class="oculto">
    <div class="bar">
      <div class="tabs" id="tabs">
        <button type="button" class="chip" data-f="pendiente">Pendientes <span id="n-pendiente"></span></button>
        <button type="button" class="chip" data-f="aprobado">Aprobadas <span id="n-aprobado"></span></button>
        <button type="button" class="chip" data-f="todos">Todas</button>
      </div>
      <button id="salir" type="button" class="btn btn-line" style="padding:8px 18px">Salir</button>
    </div>
    <div class="items" id="lista"></div>
  </section>
</main>

<script>
  const O = CONFIG.opiniones;
  const TABLA = O.tabla;
  const db = window.supabase.createClient(O.supabaseUrl, O.supabaseKey);
  const $ = (id) => document.getElementById(id);
  const hash = new URLSearchParams(window.location.hash.slice(1));
  let filtro = "pendiente";
  let enRecuperacion = hash.get("type") === "recovery";
  const estrellas = (n) => "★".repeat(n) + "☆".repeat(5 - n);

  function nota(el, txt, ok) { el.textContent = txt; el.className = "msg " + (ok ? "ok" : "err"); }

  function pintarTabs() {
    document.querySelectorAll("#tabs .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filtro)));
  }

  function boton(txt, clase, fn) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn " + clase; b.textContent = txt;
    b.addEventListener("click", fn);
    return b;
  }

  async function cargar() {
    pintarTabs();
    const { data, error } = await db.from(TABLA).select("*").order("creado", { ascending: false });
    const lista = $("lista");
    lista.replaceChildren();
    if (error) { lista.textContent = "Error al cargar. ¿Iniciaste sesión con el correo de administrador y ya corriste el SQL de Supabase?"; return; }

    $("n-pendiente").textContent = "(" + data.filter(c => c.estado === "pendiente").length + ")";
    $("n-aprobado").textContent = "(" + data.filter(c => c.estado === "aprobado").length + ")";
    const ver = filtro === "todos" ? data : data.filter(c => c.estado === filtro);
    if (!ver.length) { const p = document.createElement("p"); p.className = "vacío"; p.textContent = "No hay opiniones en esta sección."; lista.append(p); return; }

    ver.forEach(c => {
      const card = document.createElement("article");
      card.className = "item" + (c.estado === "aprobado" ? " ok" : "");

      const top = document.createElement("div"); top.className = "top";
      const nombre = document.createElement("strong"); nombre.textContent = c.nombre;
      const st = document.createElement("span"); st.className = "stars"; st.textContent = estrellas(c.calificacion);
      st.setAttribute("aria-label", c.calificacion + " de 5 estrellas");
      top.append(nombre, st);

      const meta = document.createElement("p"); meta.className = "meta";
      meta.textContent = [c.pedido, new Date(c.creado).toLocaleString("es-MX"), c.estado === "aprobado" ? "Publicada" : "Pendiente"].filter(Boolean).join(", ");

      const texto = document.createElement("p"); texto.className = "texto"; texto.textContent = c.comentario;

      const resp = document.createElement("textarea");
      resp.rows = 2; resp.maxLength = 500; resp.placeholder = "Tu respuesta pública (opcional)"; resp.value = c.respuesta || "";
      resp.setAttribute("aria-label", "Respuesta pública");

      const acc = document.createElement("div"); acc.className = "acciones";
      acc.append(c.estado === "pendiente"
        ? boton("Aprobar", "btn-main", () => cambiar(c.id, "aprobado"))
        : boton("Ocultar", "btn-line", () => cambiar(c.id, "pendiente")));
      acc.append(boton("Guardar respuesta", "btn-line", () => guardarRespuesta(c.id, resp.value)));
      acc.append(boton("Eliminar", "btn-peligro", () => eliminar(c.id)));

      card.append(top, meta, texto, resp, acc);
      lista.append(card);
    });
  }

  async function cambiar(id, estado) {
    const { error } = await db.from(TABLA).update({ estado }).eq("id", id);
    if (error) alert("No se pudo actualizar.");
    cargar();
  }
  async function guardarRespuesta(id, txt) {
    const { error } = await db.from(TABLA).update({ respuesta: txt.trim() || null }).eq("id", id);
    alert(error ? "No se pudo guardar la respuesta." : "Respuesta guardada.");
    cargar();
  }
  async function eliminar(id) {
    if (!confirm("¿Eliminar esta opinión definitivamente?")) return;
    const { error } = await db.from(TABLA).delete().eq("id", id);
    if (error) alert("No se pudo eliminar.");
    cargar();
  }

  function mostrarPanel(si) {
    $("login").classList.toggle("oculto", si || enRecuperacion);
    $("reset").classList.add("oculto");
    $("nueva").classList.toggle("oculto", !enRecuperacion);
    $("panel").classList.toggle("oculto", !si || enRecuperacion);
    if (si && !enRecuperacion) cargar();
  }

  $("forgot").addEventListener("click", () => {
    $("login").classList.add("oculto"); $("reset").classList.remove("oculto");
    $("reset-email").value = $("email").value.trim(); $("reset-msg").textContent = "";
  });
  $("volver").addEventListener("click", () => { $("reset").classList.add("oculto"); $("login").classList.remove("oculto"); });

  $("reset").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { error } = await db.auth.resetPasswordForEmail($("reset-email").value.trim(), { redirectTo: window.location.origin + window.location.pathname });
    nota($("reset-msg"), error ? "No se pudo enviar el enlace. Revisa la configuración de recuperación en Supabase." : "Si el correo está registrado, recibirás un enlace para restablecer la contraseña.", !error);
  });

  $("nueva").addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = $("nueva-msg");
    if ($("pw1").value !== $("pw2").value) return nota(m, "Las contraseñas no coinciden.", false);
    const { error } = await db.auth.updateUser({ password: $("pw1").value });
    if (error) return nota(m, "No se pudo actualizar la contraseña. Pide un enlace nuevo e inténtalo otra vez.", false);
    enRecuperacion = false; mostrarPanel(true);
  });

  db.auth.onAuthStateChange((evento) => {
    if (evento === "PASSWORD_RECOVERY") {
      enRecuperacion = true;
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
      mostrarPanel(false);
    }
  });

  const errRec = hash.get("error_description");
  if (errRec) {
    $("login-error").textContent = "El enlace de recuperación venció o no es válido. Pide uno nuevo.";
    window.history.replaceState(null, "", window.location.pathname + window.location.search);
  } else if (enRecuperacion) { mostrarPanel(false); }

  $("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("login-error").textContent = "";
    const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) { $("login-error").textContent = "Correo o contraseña incorrectos."; return; }
    mostrarPanel(true);
  });

  $("salir").addEventListener("click", async () => { await db.auth.signOut(); mostrarPanel(false); });
  $("tabs").addEventListener("click", (e) => { const f = e.target.closest(".chip")?.dataset.f; if (f) { filtro = f; cargar(); } });

  db.auth.getSession().then(({ data, error }) => {
    if (error) { $("login-error").textContent = "No se pudo verificar la sesión. Recarga la página e inténtalo de nuevo."; return; }
    if (!enRecuperacion && !errRec) mostrarPanel(!!data.session);
  });
</script>
</body>
</html>
